<!doctype html>
<html lang="es" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d14">
  <meta name="color-scheme" content="dark">
  <title>Vinil06 Design Template</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="design-tokens.css">
</head>
<body>
  <main class="app-column">
    <header class="glass-panel panel row-between">
      <span class="badge badge-accent"><span class="dot"></span>En vivo</span>
      <h1 class="text-base font-extrabold">Vinil06 · Template</h1>
    </header>

    <section class="glass-panel panel col">
      <p class="eyebrow">Superficie glass</p>
      <p class="muted">Plantilla base con los tokens del design system. Edita <code>design-tokens.css</code> para adaptar.</p>
      <div class="row">
        <button class="btn btn-primary">Acción principal</button>
        <button class="btn btn-ghost">Secundaria</button>
        <button class="btn btn-amber">Ámbar</button>
      </div>
    </section>

    <section class="glass-panel panel col">
      <label class="field-label" for="code">Código de sala</label>
      <input id="code" class="field field-code" placeholder="ROCK88" />
      <p class="error-text">Mensaje de error de ejemplo.</p>
    </section>

    <section class="glass-panel panel col">
      <div class="card-scene" style="height: 180px;">
        <div class="card-inner is-flipped">
          <div class="card-face glass-panel flex items-center justify-center">
            <span class="eyebrow">Dorso · tocadiscos</span>
          </div>
          <div class="card-face card-front flex items-center justify-center">
            <span class="eyebrow">Frente · portada</span>
          </div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
