<button
  type="button"
  class="card-scene card-tap card"
  [disabled]="disabled()"
  [attr.aria-label]="ariaLabel()"
  (click)="choose.emit()"
>
  <div class="card-inner" [class.is-flipped]="flipped()">
    <!-- Dorso: naipe boca abajo con tocadiscos / vinilo girando -->
    <div class="card-face card-back glass-panel">
      <div class="back-head">
        <span>♠ VINILO</span>
        <span>#{{ index() + 1 }}</span>
      </div>

      <div class="turntable-wrap">
        <svg viewBox="0 0 140 140" class="turntable" aria-hidden="true">
          <rect x="12" y="14" width="116" height="112" rx="18" fill="#131826" stroke="rgba(255,255,255,0.12)" stroke-width="2" />
          <g [class.vinyl-spinning]="spinning()" [class.vinyl-paused]="!spinning()">
            <circle cx="64" cy="70" r="42" fill="#090b10" stroke="#273043" stroke-width="2" />
            <circle cx="64" cy="70" r="34" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="1" />
            <circle cx="64" cy="70" r="26" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="1" />
            <circle cx="64" cy="70" r="18" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="1" />
            <circle cx="64" cy="70" r="13" fill="#10b981" />
            <circle cx="64" cy="70" r="13" [attr.fill]="'url(#' + shineId() + ')'" opacity="0.35" />
            <path d="M64 57 A13 13 0 0 1 77 70" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
            <circle cx="64" cy="70" r="3.2" fill="#090b10" />
          </g>
          <circle cx="111" cy="32" r="7" fill="#334155" stroke="#64748b" stroke-width="1.5" />
          <path d="M111 32 L106 68 L92 84" fill="none" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
          <rect x="87" y="81" width="8" height="5" rx="1.5" transform="rotate(-38 91 83.5)" fill="#34d399" />
          <circle cx="25" cy="113" r="3" [attr.fill]="spinning() ? '#34d399' : '#64748b'" />
          <defs>
            <linearGradient [attr.id]="shineId()" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#ffffff" />
              <stop offset="100%" stop-color="#000000" />
            </linearGradient>
          </defs>
        </svg>
      </div>

      <span class="back-status" [class.status-listening]="spinning()">{{ backLabel() }}</span>
    </div>

    <!-- Frente: portada + canción + artista -->
    <div
      class="card-face card-front"
      [class.front-correct]="frontState() === 'correct'"
      [class.front-wrong]="frontState() === 'wrong'"
      [class.front-selected]="frontState() === 'selected'"
      [class.front-dim]="frontState() === 'dim'"
    >
      <div class="cover">
        <app-album-art
          [palette]="option().palette"
          [motif]="option().motif"
          [uid]="'cover_' + uid()"
          [src]="option().cover ?? ''"
        />
        @if (frontState() === 'correct') {
          <span class="cover-badge badge-correct">Correcta</span>
        } @else if (frontState() === 'wrong') {
          <span class="cover-badge badge-wrong">Tu elección</span>
        }
      </div>
      <div class="info">
        <p class="song">{{ option().title }}</p>
        <p class="artist truncate">{{ option().artist }}</p>
      </div>
    </div>
  </div>
</button>
