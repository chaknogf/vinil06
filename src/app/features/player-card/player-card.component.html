<div class="app-column deck-page">
  @if (listening()) {
    <p class="host-speaker-notice" role="status">
      🎵 El audio sale del <strong>altavoz del anfitrión</strong>. Hay que estar presente para escuchar y jugar.
    </p>
  }
  <app-vinyl-deck-arena />

  @if (phase() === 'PODIUM') {
    <app-podium
      [players]="state().players"
      [title]="podiumTitle()"
      [subtitle]="podiumSubtitle()"
      [highlightId]="clientId()"
      [showAction]="false"
    />
    <p class="podium-wait" role="status">Esperando a que el anfitrión inicie otra partida…</p>
  } @else if (phase() !== 'LOBBY') {
    <app-leaderboard-panel
      [players]="state().players"
      [results]="state().results"
      [highlightId]="clientId()"
    />
  }
</div>
