<div class="app-column deck-page">
  @if (audio.blocked() && (phase() === 'LISTEN_8S' || phase() === 'KARAOKE_TURN')) {
    <button type="button" class="audio-unlock" (click)="audio.retry()">
      ▶ Tocar para escuchar
    </button>
  }
  <app-vinyl-deck-arena />

  @if (phase() === 'PODIUM') {
    <app-podium
      [players]="state().players"
      [title]="podiumTitle()"
      [subtitle]="podiumSubtitle()"
      [showAction]="false"
    />
  } @else if (phase() !== 'LOBBY') {
    <app-leaderboard-panel
      [players]="state().players"
      [results]="state().results"
      [highlightId]="clientId()"
    />
  }
</div>
