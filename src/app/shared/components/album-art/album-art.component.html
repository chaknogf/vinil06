@if (showRemote()) {
  <img
    class="cover-img"
    [src]="remoteSrc()"
    alt=""
    aria-hidden="true"
    loading="lazy"
    decoding="async"
    (error)="onImageError()"
  />
} @else {
  <svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient [attr.id]="gradientId" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" [attr.stop-color]="palette()[0]" />
        <stop offset="100%" [attr.stop-color]="palette()[1]" />
      </linearGradient>
    </defs>

    <rect width="100" height="100" [attr.fill]="'url(#' + gradientId + ')'" />

    @switch (motif() % 4) {
      @case (0) {
        <circle cx="72" cy="28" r="24" fill="rgba(255,255,255,0.16)" />
        <circle cx="30" cy="70" r="18" fill="rgba(255,255,255,0.10)" />
      }
      @case (1) {
        <polygon points="50,14 86,82 14,82" fill="rgba(255,255,255,0.14)" />
      }
      @case (2) {
        <rect
          x="18" y="18" width="64" height="64" rx="16"
          transform="rotate(15 50 50)"
          fill="rgba(255,255,255,0.14)"
        />
      }
      @default {
        <circle cx="50" cy="50" r="34" stroke="rgba(255,255,255,0.22)" stroke-width="6" fill="none" />
        <circle cx="50" cy="50" r="12" fill="rgba(255,255,255,0.25)" />
      }
    }

    <circle cx="50" cy="50" r="8" fill="rgba(9,11,16,0.55)" />
    <circle cx="50" cy="50" r="2.5" fill="#ffffff" />
  </svg>
}
