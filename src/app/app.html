<div class="app-shell">
  @if (session.connection() === 'unavailable' && session.inSession()) {
    <div class="connection-banner" role="status">
      No se pudo conectar con la sala. Si eres invitado, comprueba el código y que el anfitrión tenga Vinil06 abierto.
    </div>
  }
  <app-install-prompt />
  <router-outlet />
</div>

<app-ephemeral-privacy-modal
  [visible]="session.privacyVisible()"
  (accept)="onAccept()"
  (manual)="onManual()"
  (dismiss)="onDismiss()"
/>
